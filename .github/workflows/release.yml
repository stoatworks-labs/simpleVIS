name: Release

# Public repo, so Actions minutes are free — the fleet's private repos have to
# build locally instead. Tag-driven: pushing v* cuts the release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # libudev-dev is for the `serialport` crate (USB DMX), not for Tauri.
          # Without it the Linux build fails deep inside libudev-sys's build
          # script with a pkg-config error that reads like a Rust problem.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libudev-dev
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present

      # NOTE: the TypeScript suites that read MA's Demostage_MVR.mvr **skip**
      # here — the file is MA Lighting's content and is not committed, so a
      # green run on CI covers roughly a third of them. They are the ones that
      # matter most, and they run locally where grandMA3 is installed. CI's real
      # value is the Rust side below, which needs no fixture, plus typecheck and
      # cross-platform builds. Do not read "tests passed" here as "everything
      # passed".
      - run: npm test --workspaces --if-present
      - name: Rust tests
        working-directory: src-tauri
        # The socket tests bind the real Art-Net and sACN ports. A CI runner has
        # them free, which a lighting workstation usually does not — so this is
        # the one place they run unconditionally.
        run: |
          cargo test
          cargo test --test receive -- --ignored --test-threads=1
          cargo test --test citp_peer -- --ignored --test-threads=1

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 and x86_64 both cross-compile from macos-14.
          # The Intel runners (macos-13) are retired — do not reintroduce them.
          # Bundle targets are per-platform: naming a bundler the host cannot
          # run (nsis on macOS, dmg on Linux) fails the whole build rather than
          # being skipped.
          # ONE macOS build for both architectures: universal-apple-darwin
          # compiles both slices and lipos them, so an Intel Mac and an Apple
          # Silicon Mac download the same file. Both were already built on this
          # one runner, so this merges them rather than adding a build.
          #
          # rust_targets is what rustup installs -- universal-apple-darwin is a
          # Tauri bundling target and `rustup target add` on it fails -- while
          # `target` and `args` stay what tauri-action is given.
          - platform: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          # No AppImage: its bundler needs FUSE, which CI runners lack, and it
          # fails there even with APPIMAGE_EXTRACT_AND_RUN=1 — taking the deb
          # and rpm targets down with it.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles deb,rpm
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets || matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Guarded, not bare `github.ref_name`: unguarded, ANY
          # workflow_dispatch from a branch publishes a real release named
          # after that branch. On a tag push this is identical.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: simpleVIS ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}


      # Proof that "universal" is universal. simpleVIS is the repo this fleet
      # learned the lesson on: it once published a macos-universal asset that
      # was arm64 only, and it configured, built, tested and uploaded clean
      # while doing it.
      #
      # Captured and matched with `case`, never piped into grep: steps run as
      # `bash -eo pipefail`, so grep exiting at its first match SIGPIPEs lipo
      # and fails the step BECAUSE the match was found.
      - name: Verify the macOS bundle is universal
        if: matrix.target == 'universal-apple-darwin'
        shell: bash
        run: |
          appdir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          app="$(find "$appdir" -maxdepth 1 -name '*.app' | head -1)"
          [ -n "$app" ] || { echo "no .app produced in $appdir" >&2; exit 1; }
          found=0
          while IFS= read -r f; do
            __archs="$( lipo -archs "$f" 2>/dev/null )" || continue
            [ -n "$__archs" ] || continue
            found=$((found+1))
            echo "${f#$app/}: $__archs"
            case "$__archs" in
              *arm64*) ;;
              *) echo "expected an arm64 slice in $f, got: $__archs" >&2; exit 1 ;;
            esac
            case "$__archs" in
              *x86_64*) ;;
              *) echo "expected an x86_64 slice in $f, got: $__archs" >&2; exit 1 ;;
            esac
          done < <(find "$app" -type f -perm -u+x)
          # A find that matched nothing would pass every check above in silence.
          if [ "$found" -lt 1 ]; then
            echo "found no Mach-O to check in $app" >&2
            exit 1
          fi

  hosted:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # The hosted build deliberately omits the Tauri backend entirely.
      - run: npm run build --workspace=@simplevis/app
      - uses: actions/upload-artifact@v7
        with:
          name: simplevis-hosted
          path: packages/app/dist
