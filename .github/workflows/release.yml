name: Release

# Public repo, so Actions minutes are free — the fleet's private repos have to
# build locally instead. Tag-driven: pushing v* cuts the release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present
      - run: npm test --workspaces --if-present
      - name: Rust tests
        working-directory: src-tauri
        # The socket tests bind the real Art-Net and sACN ports. A CI runner has
        # them free, which a lighting workstation usually does not — so this is
        # the one place they run unconditionally.
        run: cargo test && cargo test --test receive -- --ignored --test-threads=1

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 and x86_64 both cross-compile from macos-14.
          # The Intel runners (macos-13) are retired — do not reintroduce them.
          - platform: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-14
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: simpleVIS ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          # No AppImage: its bundler needs FUSE, which CI runners lack, and it
          # fails there even with APPIMAGE_EXTRACT_AND_RUN=1 — taking the deb
          # and rpm targets down with it. Linux ships .deb and .rpm.
          args: ${{ matrix.args }} --bundles app,dmg,nsis,deb,rpm

  hosted:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The hosted build deliberately omits the Tauri backend entirely.
      - run: npm run build --workspace=@simplevis/app
      - uses: actions/upload-artifact@v4
        with:
          name: simplevis-hosted
          path: packages/app/dist
