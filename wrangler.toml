# Cloudflare Worker config — static assets only.
#
# The hosted simpleVIS is a fully static SPA: the MVR the user drops never
# leaves the browser. It is deployed as a *Worker* rather than a Pages project
# because that is what the rest of the fleet uses (stagewash, pixel-peeker,
# blend-calc, aspect-calc, test-card, arraycad are all this shape).
#
# `[assets] directory` is the Worker form. The Pages form is
# `pages_build_output_dir`, and the two are not interchangeable — a repo
# carrying the Pages key fails a Worker build with "Could not detect a
# directory containing static files", which reads like a missing build rather
# than the wrong key.
#
# There is deliberately no `_redirects`: the Pages way to route an SPA is a
# `/*  /index.html  200` line, and the assets runtime rejects it as an infinite
# loop and fails the whole deploy. `not_found_handling` is the Worker
# equivalent.
#
# `-demo`, on both the Worker name and the host, since 2026-09-10. A browser
# cannot receive Art-Net, sACN or CITP, so this build has no input and can only
# ever demonstrate the desktop app — it is listed on the site as a demo rather
# than in the Web tools menu, and it is named the way every other demo in the
# fleet is (old-cathode-demo, nesolume-demo). The Worker name matches the host
# on purpose: that is the fleet's rule, and it is what makes a stray Worker in
# the dashboard identifiable. Renaming a Worker does not move one, it deploys a
# second — the old `simplevis` Worker was deleted by hand afterwards, which is
# what released `simplevis.stoatworks-labs.com` and its managed DNS record.
name = "simplevis-demo"
compatibility_date = "2026-08-02"

# `custom_domain = true` makes Cloudflare create and manage the DNS record
# itself. Adding a proxied CNAME by hand as well conflicts with it.
[[routes]]
pattern = "simplevis-demo.stoatworks-labs.com"
custom_domain = true

[assets]
directory = "./packages/app/dist"
not_found_handling = "single-page-application"
